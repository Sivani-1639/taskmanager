<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register - TaskManager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand"><div class="logo"></div> TaskManager</div>
      <a class="btn secondary" href="index.html">Home</a>
    </div>

    <div class="card" style="max-width:520px;margin:0 auto;">
      <h2 style="margin-top:0">Create your account</h2>
      <form id="registerForm">
        <div class="field">
          <label>Username</label>
          <input class="input" type="text" id="reg-username" required autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input class="input" type="password" id="reg-password" required minlength="6" autocomplete="new-password">
          <span class="helper">At least 6 characters</span>
        </div>
        <button class="btn" type="submit">Create account</button>
      </form>
      <p class="helper" id="register-error" style="color:#fca5a5;display:none;margin-top:10px;"></p>
      <hr class="sep">
      <p class="helper">Already registered? <a class="link" href="login.html">Log in</a></p>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    initAuthPages(true);
  </script>
</body>
</html>
