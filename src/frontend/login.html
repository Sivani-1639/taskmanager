<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login - TaskManager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand"><div class="logo"></div> TaskManager</div>
      <a class="btn secondary" href="index.html">Home</a>
    </div>

    <div class="card" style="max-width:520px;margin:0 auto;">
      <h2 style="margin-top:0">Welcome back</h2>
      <form id="loginForm">
        <div class="field">
          <label>Username</label>
          <input class="input" type="text" id="login-username" required autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input class="input" type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button class="btn" type="submit">Sign in</button>
      </form>
      <p class="helper" id="login-error" style="color:#fca5a5;display:none;margin-top:10px;"></p>
      <hr class="sep">
      <p class="helper">No account? <a class="link" href="register.html">Create one</a></p>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    initAuthPages();
  </script>
</body>
</html>
